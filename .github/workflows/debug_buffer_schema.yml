name: Debug Buffer Schema

on:
  workflow_dispatch:

jobs:
  introspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Introspeccion de tipos de Buffer
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BUFFER_TOKEN:-}" ]; then
            echo "::error::BUFFER_TOKEN no esta configurado en secrets"
            exit 1
          fi

          introspect_type() {
            local TYPE_NAME="$1"
            echo ""
            echo "========================================================"
            echo "  Tipo: $TYPE_NAME"
            echo "========================================================"
            local QUERY
            QUERY=$(printf '{"query":"query { __type(name: \\"%s\\") { name kind description inputFields { name description type { name kind ofType { name kind ofType { name kind } } } } } }"}' "$TYPE_NAME")
            curl -sS -X POST https://api.buffer.com/ \
              -H "Authorization: Bearer $BUFFER_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$QUERY" | python3 -m json.tool
          }

          # CreatePostInput primero (sanity check del run anterior)
          introspect_type "CreatePostInput"

          # Candidatos para el tipo de asset
          for T in PostAssetInput AssetInput CreateAssetInput PostAsset; do
            introspect_type "$T"
          done
