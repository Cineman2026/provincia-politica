name: Debug Buffer Schema

on:
  workflow_dispatch:

jobs:
  introspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Introspeccion del enum PostType
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BUFFER_TOKEN:-}" ]; then
            echo "::error::BUFFER_TOKEN no esta configurado en secrets"
            exit 1
          fi

          QUERY='{"query":"query { __type(name: \"PostType\") { name kind description enumValues { name description } } }"}'

          echo "=== Introspeccion del enum PostType ==="
          curl -sS -X POST https://api.buffer.com/ \
            -H "Authorization: Bearer $BUFFER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY" | python3 -m json.tool
