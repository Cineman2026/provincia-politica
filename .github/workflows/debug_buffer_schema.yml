name: Debug Buffer Schema

on:
  workflow_dispatch:

jobs:
  introspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Introspeccion de CreatePostInput
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BUFFER_TOKEN:-}" ]; then
            echo "::error::BUFFER_TOKEN no esta configurado en secrets"
            exit 1
          fi

          QUERY='{"query":"query { __type(name: \"CreatePostInput\") { name kind description inputFields { name description type { name kind ofType { name kind ofType { name kind } } } } } }"}'

          echo "=== Enviando introspeccion a https://api.buffer.com/ ==="
          RESPONSE=$(curl -sS -X POST https://api.buffer.com/ \
            -H "Authorization: Bearer $BUFFER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY")

          echo "=== Respuesta cruda ==="
          echo "$RESPONSE"

          echo ""
          echo "=== Respuesta formateada ==="
          echo "$RESPONSE" | python3 -m json.tool
