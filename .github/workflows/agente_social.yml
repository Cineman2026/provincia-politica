name: Agente Social — Provincia Política

concurrency:
  group: agente-social
  cancel-in-progress: false

on:
  schedule:
    # Cada hora entre 10:00 y 01:00 UTC (7am-22pm Argentina)
    - cron: '0 10-23 * * *'
    - cron: '0 0,1 * * *'
  workflow_dispatch:

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests Pillow boto3

      - name: Descargar fuentes estáticas (no variable fonts)
        run: |
          mkdir -p fonts
          cd fonts
          # Fraunces — usar archivos estáticos individuales del subdirectorio /static/
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/fraunces/static/Fraunces_9pt-Bold.ttf" -o Fraunces-Bold.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/fraunces/static/Fraunces_9pt-BoldItalic.ttf" -o Fraunces-BoldItalic.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/fraunces/static/Fraunces_9pt-Italic.ttf" -o Fraunces-Italic.ttf
          # Inter — estático
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/inter/static/Inter-Regular.ttf" -o Inter-Regular.ttf
          # JetBrains Mono — estático
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/jetbrainsmono/static/JetBrainsMono-Regular.ttf" -o JetBrainsMono-Regular.ttf
          ls -la
          # Verificar que todos los archivos pesen razonable (>100KB cada uno)
          for f in *.ttf; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 50000 ]; then
              echo "❌ $f es demasiado chico ($size bytes) — posible 404"
              exit 1
            fi
            echo "✅ $f ($size bytes)"
          done

      - name: Ejecutar Agente Social
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          CF_R2_PUBLIC_URL: ${{ secrets.CF_R2_PUBLIC_URL }}
          FONT_DIR: fonts
        run: python agente_social.py
